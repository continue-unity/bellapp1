          package com.iljagrim.bellapp;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Button;

          public class PrivacyActivity extends Activity {
              private static final int BLUE = Color.rgb(103, 188, 224);
              private static final int YELLOW = Color.rgb(255, 215, 64);

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(28, 32, 28, 24);
                  root.setBackgroundColor(BLUE);

                  TextView title = text("Privacy Policy", 24, true);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title, lp());

                  TextView body = text("BellApp does not collect personal data.\n\nBellApp does not use ads, analytics, tracking, accounts, internet access, location, contacts, camera, or microphone.\n\nBellApp stores only local settings on the device: sound choice, chime mode, run mode, and enabled/off state.", 16, false);
                  body.setPadding(0, 18, 0, 18);
                  root.addView(body, lp());

                  Button back = button("Back");
                  back.setOnClickListener(v -> finish());
                  root.addView(back, lp());
                  setContentView(root);
              }

              private TextView text(String s, int size, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(Color.BLACK);
                  if (bold) t.setTypeface(Typeface.DEFAULT_BOLD);
                  return t;
              }
              private Button button(String s) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setTextColor(Color.BLACK);
                  b.setBackgroundColor(YELLOW);
                  return b;
              }
              private LinearLayout.LayoutParams lp() {
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  p.setMargins(0, 6, 0, 6);
                  return p;
              }
          }
