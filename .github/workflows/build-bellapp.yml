# Changes after V6.9.7.1:
# - Volume bay expanded into a clearer three-line area.
# - Volume shows the chosen number above the slider.
# - Volume slider has 1–11 measurement ticks and icon-yellow knob/progress.
# - Library bay now uses direct 1–5 slot buttons instead of a hidden wheel.
# - Library shows selected slot number/name and helper text.
# - Footer/version text follows the same body size rule as the rest of the app.
# - Keeps V6.9.7.1 resource fix, icon colours, fixed bay, Custom+ import copy,
#   silent pre-ring timing attempt, and tap-notification-body-to-silence.
#
