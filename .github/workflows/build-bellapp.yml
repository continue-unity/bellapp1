# BELLAPP V6.9.7.3 LIBRARY WHEEL TEST — COPY THIS ENTIRE FILE
# GitHub filename: .github/workflows/build-bellapp.yml
#
# Changes after V6.9.7.2:
# - Library is a NumberPicker/wheel again, not 1-5 buttons.
# - Library shows a 3-row wheel style like the clock picker: next above, chosen in the middle, previous below.
# - Library starts with 3 Empty rows when no imports exist.
# - Library is not limited to 5 sounds; it scans every file imported into BellApp custom_sounds storage.
# - Imported Custom+ files are copied into BellApp storage and then appear in Library.
# - Volume keeps the clearer chosen number and 1-11 measurement ticks.
# - Keeps icon colours, same-size body text, fixed bay, silent timing precision attempt, and tap-notification-body-to-silence.
#
name: Build BellApp V6.9.7.3 library wheel test

