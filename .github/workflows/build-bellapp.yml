# BELLAPP V6.9.7 UI + VOLUME + LIBRARY + TIMING TEST â€” COPY THIS ENTIRE FILE
# GitHub filename: .github/workflows/build-bellapp.yml
#
# New in V6.9.7:
# - App colours adjusted to match the icon blue/yellow.
# - Main text sizes unified except the BellApp title.
# - Status now shows State, Period, Sound, Volume, Signal, Rings.
# - Long Pattern sentence removed.
# - Circles added to SET / STOP / TEST and main option buttons.
# - Ringing row is Time / Volume / Library.
# - One fixed interactive bay changes between time wheels, 1â€“11 volume slider, and a 5-slot custom library wheel.
# - Custom+ stays in the Bell / Cuckoo / Custom+ sound row.
# - Custom+ imports/copies selected audio into BellApp's internal custom-sounds storage and places it into a library slot.
# - Pre-ring timing waits shortly before the target second and rings as close to the phone clock target as Android allows.
# - Ringing notification says TAP TO SILENCE; tapping the notification body silences playback.
# - No recorder, no strict alarm mode, no visible Last/Calibration line.
#
name: Build BellApp V6.9.7 UI volume library timing test

