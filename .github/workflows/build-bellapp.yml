      - name: Add BellApp source payload 19 of 19
        shell: bash
        run: |
          cat >> /tmp/bellapp-v7-fresh.b64 <<'BELLAPP_V7_FRESH_19'
          4rA+SPcg6H6mBawOFvtR3NLHIQO9xYAojDs62AMJFjtOMkJi5MGSDBkyZMiQIUOGDBkyZMiQIUOG
          DBkyZMiQIUOGDBkyZMiQIUOGzP8F/wHXFgi5AEgDAA==
          BELLAPP_V7_FRESH_19

      - name: Reconstruct fresh BellApp project
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode /tmp/bellapp-v7-fresh.b64 > /tmp/bellapp-v7-fresh.tar.gz
          tar -xzf /tmp/bellapp-v7-fresh.tar.gz
          test -f app/build.gradle
          test -f app/src/main/java/com/iljagrim/bellapp/BellScheduler.java
          test -f app/src/main/java/com/iljagrim/bellapp/SignalService.java
          test -f app/src/main/java/com/iljagrim/bellapp/MainActivity.java
          test -f BELLAPP_RULES.txt

      - name: Embed repository link and exact workflow
        shell: bash
        env:
          REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          sed -i "s|__REPOSITORY_URL__|$REPOSITORY_URL|g" app/src/main/java/com/iljagrim/bellapp/MainActivity.java
          test -f .github/workflows/build-bellapp.yml
          cp .github/workflows/build-bellapp.yml app/src/main/res/raw/app_code.txt

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          java -version

      - name: Download verified Gradle 9.6.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-9.6.0-bin.zip -o /tmp/gradle-9.6.0-bin.zip
          curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-9.6.0-bin.zip.sha256 -o /tmp/gradle-9.6.0-bin.zip.sha256
          echo "$(cat /tmp/gradle-9.6.0-bin.zip.sha256)  /tmp/gradle-9.6.0-bin.zip" | sha256sum -c -
          unzip -q /tmp/gradle-9.6.0-bin.zip -d /tmp
          /tmp/gradle-9.6.0/bin/gradle --version

      - name: Build fresh BellApp APK
        shell: bash
        run: |
          set -euo pipefail
          /tmp/gradle-9.6.0/bin/gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify and name APK
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk BellApp-V7-clean-from-scratch.apk
          ls -lh BellApp-V7-clean-from-scratch.apk

      - name: Upload APK and product rules
        uses: actions/upload-artifact@v6
        with:
          name: BellApp-V7-clean-from-scratch
          path: |
            BellApp-V7-clean-from-scratch.apk
            BELLAPP_RULES.txt
            TEST_NOTES.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish direct test APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release delete bellapp-v7-clean-from-scratch --cleanup-tag --yes 2>/dev/null || true
          gh release create bellapp-v7-clean-from-scratch BellApp-V7-clean-from-scratch.apk BELLAPP_RULES.txt TEST_NOTES.txt --target "$GITHUB_SHA" --title "BellApp V7 clean from scratch" --notes "Fresh rebuild. Exact-alarm scheduler and playback are separated; next event is scheduled before current playback; stale alarms are skipped; Bell/Cuckoo/Custom+ use the media route with transient ducking; Time/Volume/Library share one fixed bay; Custom+ imports into BellApp Library." --prerelease
