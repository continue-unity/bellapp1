# BELLAPP V6.9.3 SILENCE NOTIFICATION TEST — COPY THIS ENTIRE FILE
# GitHub filename: .github/workflows/build-bellapp.yml
#
# Based on V6.9.2.
#
# New in V6.9.3:
# - Ringing notification simplified to one purpose: Silence.
# - Removed Stop from the ringing notification.
# - Removed period/time text from the ringing notification.
# - Tapping the ringing notification itself now triggers Silence.
# - Ringing channel moved to a new high-importance channel.
# - Ringing notification is public on the lock screen where Android settings allow it.
# - Failed volume-button watcher disabled to avoid side effects.
# - App STOP button and permanent console STOP still stop active playback.
#
name: Build BellApp V6.9.3 silence notification test

