      - name: Reconstruct BellApp project
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode /tmp/bellapp-v7-clean3.b64 > /tmp/bellapp-v7-clean3.tar.gz
          tar -xzf /tmp/bellapp-v7-clean3.tar.gz
          test -f app/build.gradle
          test -f BELLAPP_RULES.txt
          test -f BELLAPP_CHANGELOG.txt
          test -f TEST_NOTES.txt
          test -f app/src/main/java/com/iljagrim/bellapp/NotificationHelper.java

      - name: Embed repository link and exact workflow
        shell: bash
        env:
          REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          sed -i "s|__REPOSITORY_URL__|$REPOSITORY_URL|g" app/src/main/java/com/iljagrim/bellapp/MainActivity.java
          test -f .github/workflows/build-bellapp.yml
          cp .github/workflows/build-bellapp.yml app/src/main/res/raw/app_code.txt

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Download verified Gradle 9.6.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-9.6.0-bin.zip -o /tmp/gradle-9.6.0-bin.zip
          curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-9.6.0-bin.zip.sha256 -o /tmp/gradle-9.6.0-bin.zip.sha256
          echo "$(cat /tmp/gradle-9.6.0-bin.zip.sha256)  /tmp/gradle-9.6.0-bin.zip" | sha256sum -c -
          unzip -q /tmp/gradle-9.6.0-bin.zip -d /tmp
          /tmp/gradle-9.6.0/bin/gradle --version

      - name: Build BellApp debug APK
        shell: bash
        run: |
          set -euo pipefail
          /tmp/gradle-9.6.0/bin/gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify and name APK
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk BellApp-V7-CLEAN-REBUILD-3.apk
          ls -lh BellApp-V7-CLEAN-REBUILD-3.apk

      - name: Upload APK rules changelog and tests
        uses: actions/upload-artifact@v6
        with:
          name: BellApp-V7-CLEAN-REBUILD-3
          path: |
            BellApp-V7-CLEAN-REBUILD-3.apk
            BELLAPP_RULES.txt
            BELLAPP_CHANGELOG.txt
            TEST_NOTES.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish direct test APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release delete bellapp-v7-clean-rebuild-3 --cleanup-tag --yes 2>/dev/null || true
          gh release create bellapp-v7-clean-rebuild-3 BellApp-V7-CLEAN-REBUILD-3.apk BELLAPP_RULES.txt BELLAPP_CHANGELOG.txt TEST_NOTES.txt --target "$GITHUB_SHA" --title "BellApp V7 clean rebuild 3" --notes "Adds repository-owned real-world changelog. Permanent console is simplified: no Test/Stop/Set actions; tapping the whole console silences current playback only and never disables future signals." --prerelease