# BELLAPP V7.0 — PRECISION AND RESPONSIVE INTERFACE TEST
# Copy this entire file to .github/workflows/build-bellapp.yml
#
# V7 changes:
# - independent optional NTP clock reference; Android network/system fallback
# - next alarm scheduled before current event playback
# - short service-based pre-wake, held wake lock, prepared audio, monotonic countdown
# - late/stale events are skipped instead of ringing when the app opens
# - Sound and Interface vertical 1–11 wheels in the shared Volume bay
# - Interface size adjusts when SET is pressed; responsive layout and scroll fallback
# - Library remains unlimited 3-row clock-style wheel (next above, previous below)
# - Custom+ remains in sound row; imports are stored inside the app
# - Silent calibration, status shows saved Volume, floating notification tap to silence
# - Recorder and full-screen alarm mode are NOT included
#
name: Build BellApp V7.0 precision interface test

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

