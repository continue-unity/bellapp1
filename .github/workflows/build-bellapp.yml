      - name: Decode and verify BellApp project
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode /tmp/bellapp.b64 > /tmp/bellapp.tar.gz
          echo "cb0dbdbda7fa25dc8b1ca48ac0f6bce56037de18784ca6362003d4a7882e858d  /tmp/bellapp.tar.gz" | sha256sum -c -
          rm -rf app build.gradle settings.gradle play-store
          tar -xzf /tmp/bellapp.tar.gz

      - name: Insert repository URL and exact workflow code
        shell: bash
        env:
          REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          sed -i "s|__REPOSITORY_URL__|$REPOSITORY_URL|g" app/src/main/java/com/iljagrim/bellapp/MainActivity.java
          test -f .github/workflows/build-bellapp.yml
          cp .github/workflows/build-bellapp.yml app/src/main/res/raw/app_code.txt

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          java -version

      - name: Download verified Gradle 8.10.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle-8.10.2-bin.zip
          curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-8.10.2-bin.zip.sha256 -o /tmp/gradle-8.10.2-bin.zip.sha256
          echo "$(cat /tmp/gradle-8.10.2-bin.zip.sha256)  /tmp/gradle-8.10.2-bin.zip" | sha256sum -c -
          rm -rf /tmp/gradle-8.10.2
          unzip -q /tmp/gradle-8.10.2-bin.zip -d /tmp
          /tmp/gradle-8.10.2/bin/gradle --version

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          /tmp/gradle-8.10.2/bin/gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk BellApp-V6.9.7.2-debug.apk
          ls -lh BellApp-V6.9.7.2-debug.apk

      - name: Upload APK to this Actions run
        uses: actions/upload-artifact@v6
        with:
          name: BellApp-V6.9.7.2-APK
          path: |
            BellApp-V6.9.7.2-debug.apk
            play-store/privacy-policy-template.html
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish direct APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release delete bellapp-v6.9.7.2-clarity-test --cleanup-tag --yes 2>/dev/null || true
          gh release create bellapp-v6.9.7.2-clarity-test BellApp-V6.9.7.2-debug.apk play-store/privacy-policy-template.html --target "$GITHUB_SHA" --title "BellApp V6.9.7.2 clarity test" --notes "Volume clarity and library access test: three-line volume bay, selected volume number, 1-11 measurement ticks, direct 1-5 library slots, same-size text polish, plus V6.9.7 timing and tap-to-silence behaviour." --prerelease