# BELLAPP V6.9.6 SOUND BUTTONS + SET STATE TEST — COPY THIS ENTIRE FILE
# GitHub filename: .github/workflows/build-bellapp.yml
#
# Based on V6.9.5.
#
# New in V6.9.6:
# - Bell / Cuckoo / Custom remain pressable while Vibrate pattern is selected.
# - Sound status now shows the saved selected sound even in Vibrate mode.
# - Scrolling/tampering with ringing period wheels visibly deselects SET.
# - Pressing SET saves the wheel values, starts/reschedules, and selects SET again.
# - Keeps V6.9.5 alarm-attributed vibration test.
# - Keeps simplified Silence-only ringing notification.
#
