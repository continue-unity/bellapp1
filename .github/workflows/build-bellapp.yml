# BELLAPP V6.9.4 SET + VIBRATION FIX TEST — COPY THIS ENTIRE FILE
# GitHub filename: .github/workflows/build-bellapp.yml
#
# Based on the latest V6.9.x control redesign.
#
# New in V6.9.4:
# - Pattern now uses the same bold label style as State / Period / Sound.
# - Period wheels now show a visible dash between start and stop times.
# - START button renamed to SET, while keeping the same save/start/reschedule function.
# - Console OFF action also says Set.
# - Vibrate TEST made stronger and explicit: one clear 360 ms vibration.
# - Ringing notification remains simple: tap or press Silence only.
# - Stop remains available in the app/permanent console but not in the ringing notification.
# - Volume-button watcher remains disabled.
#
name: Build BellApp V6.9.4 set vibration fix test

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

