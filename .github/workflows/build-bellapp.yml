          echo "99c621d631a3f80694e58f1273f806a4bbfaeedac5816d1f3cf6b71a108e49c1  /tmp/bellapp.tar.gz" | sha256sum -c -
          rm -rf app build.gradle settings.gradle play-store TESTING_V7.md
          tar -xzf /tmp/bellapp.tar.gz
          test -f app/src/main/java/com/iljagrim/bellapp/ClockSync.java
          test -f app/src/main/java/com/iljagrim/bellapp/ChimePlaybackService.java
          test -f app/src/main/AndroidManifest.xml

      - name: Insert repository URL and exact workflow code
        shell: bash
        env:
          REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          sed -i "s|__REPOSITORY_URL__|$REPOSITORY_URL|g" app/src/main/java/com/iljagrim/bellapp/MainActivity.java
          test -f .github/workflows/build-bellapp.yml
          cp .github/workflows/build-bellapp.yml app/src/main/res/raw/app_code.txt

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          java -version

      - name: Download verified Gradle 8.10.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle-8.10.2-bin.zip
          curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-8.10.2-bin.zip.sha256 -o /tmp/gradle-8.10.2-bin.zip.sha256
          echo "$(cat /tmp/gradle-8.10.2-bin.zip.sha256)  /tmp/gradle-8.10.2-bin.zip" | sha256sum -c -
          unzip -q /tmp/gradle-8.10.2-bin.zip -d /tmp
          /tmp/gradle-8.10.2/bin/gradle --version

      - name: Build V7 debug APK
        shell: bash
        run: |
          set -euo pipefail
          /tmp/gradle-8.10.2/bin/gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify and name APK
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk BellApp-V7.0-debug.apk
          ls -lh BellApp-V7.0-debug.apk

      - name: Upload APK to this Actions run
        uses: actions/upload-artifact@v6
        with:
          name: BellApp-V7.0-APK
          path: |
            BellApp-V7.0-debug.apk
            play-store/privacy-policy-template.html
            TESTING_V7.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish direct test APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release delete bellapp-v7.0-precision-interface-test --cleanup-tag --yes 2>/dev/null || true
          gh release create bellapp-v7.0-precision-interface-test BellApp-V7.0-debug.apk play-store/privacy-policy-template.html TESTING_V7.md --target "$GITHUB_SHA" --title "BellApp V7.0 precision interface test" --notes "Experimental V7 timing architecture with optional NTP reference and preloaded chimes, scheduler self-healing and stale-alarm rejection; responsive interface with separate Sound and Interface 1–11 wheels, original Library wheel, and one-tap Silence. DEBUG TEST BUILD, not a final Play release." --prerelease
