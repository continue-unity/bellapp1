# BELLAPP V6.2 EVALUATION — COPY THIS ENTIRE FILE
#
# 1. Create a new empty GitHub repository.
# 2. Choose: Add file -> Create new file.
# 3. Name the file exactly:
#       .github/workflows/build-bellapp.yml
# 4. Paste this entire file and commit it.
# 5. The build starts automatically. Open Actions -> Build BellApp V6.2 evaluation.
# 6. Open the completed run and download:
#       BellApp-6.2-evaluation-APK
# 7. The downloaded artifact is a ZIP. Extract it to get app-debug.apk.
# 8. Transfer app-debug.apk to the phone and install it.
#
# This file carries the complete Android source, sounds, and launcher icon. No separate source upload is needed.

name: Build BellApp V6.2 evaluation

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Check out workflow repository
        uses: actions/checkout@v4

      - name: Reconstruct BellApp project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app build.gradle settings.gradle BellApp-source.zip
          mkdir -p "$(dirname "settings.gradle")"
          cat > "settings.gradle" <<'EOF_TEXT_0'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'BellApp'
          include ':app'
          EOF_TEXT_0
          mkdir -p "$(dirname "build.gradle")"
          cat > "build.gradle" <<'EOF_TEXT_1'
          plugins {
              id 'com.android.application' version '8.8.2' apply false
          }
          EOF_TEXT_1
          mkdir -p "$(dirname "app/build.gradle")"
          cat > "app/build.gradle" <<'EOF_TEXT_2'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.iljagrim.bellapp'
              compileSdk 35

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              defaultConfig {
                  applicationId 'com.iljagrim.bellapp'
                  minSdk 23
                  targetSdk 35
                  versionCode 9
                  versionName '6.2-evaluation'
              }
          }
          EOF_TEXT_2
          mkdir -p "$(dirname "app/src/main/AndroidManifest.xml")"
          cat > "app/src/main/AndroidManifest.xml" <<'EOF_TEXT_3'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:theme="@style/AppTheme">

                  <activity android:name="com.iljagrim.bellapp.PrivacyActivity" android:exported="false" />

                  <activity android:name="com.iljagrim.bellapp.MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver android:name="com.iljagrim.bellapp.AlarmReceiver" android:exported="false" />
                  <receiver android:name="com.iljagrim.bellapp.ActionReceiver" android:exported="false" />
                  <receiver android:name="com.iljagrim.bellapp.BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.TIME_SET" />
                          <action android:name="android.intent.action.TIMEZONE_CHANGED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF_TEXT_3
          mkdir -p "$(dirname "app/src/main/res/values/strings.xml")"
          cat > "app/src/main/res/values/strings.xml" <<'EOF_TEXT_4'
          <resources>
              <string name="app_name">BellApp</string>
          </resources>
          EOF_TEXT_4
          mkdir -p "$(dirname "app/src/main/res/values/styles.xml")"
          cat > "app/src/main/res/values/styles.xml" <<'EOF_TEXT_5'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:colorAccent">#FFD740</item>
                  <item name="android:navigationBarColor">#67BCE0</item>
                  <item name="android:windowLightNavigationBar">true</item>
              </style>
          </resources>
          EOF_TEXT_5
          mkdir -p "$(dirname "app/src/main/java/com/iljagrim/bellapp/ActionReceiver.java")"
          cat > "app/src/main/java/com/iljagrim/bellapp/ActionReceiver.java" <<'EOF_TEXT_6'
          package com.iljagrim.bellapp;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class ActionReceiver extends BroadcastReceiver {
              public static final String ACTION_START = "com.iljagrim.bellapp.START";
              public static final String ACTION_STOP = "com.iljagrim.bellapp.STOP";
              public static final String ACTION_TEST = "com.iljagrim.bellapp.TEST";

              @Override
              public void onReceive(Context context, Intent intent) {
                  String action = intent.getAction();
                  if (ACTION_START.equals(action)) {
                      AppPrefs.setEnabled(context, true);
                      AlarmScheduler.scheduleNext(context);
                  } else if (ACTION_STOP.equals(action)) {
                      AppPrefs.setEnabled(context, false);
                      AlarmScheduler.cancel(context);
                  } else if (ACTION_TEST.equals(action)) {
                      ChimePlayer.playTest(context);
                      ConsoleNotification.show(context);
                  }
              }
          }
          EOF_TEXT_6
          mkdir -p "$(dirname "app/src/main/java/com/iljagrim/bellapp/AlarmReceiver.java")"
          cat > "app/src/main/java/com/iljagrim/bellapp/AlarmReceiver.java" <<'EOF_TEXT_7'
          package com.iljagrim.bellapp;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          import java.util.Calendar;

          public class AlarmReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (!AppPrefs.isEnabled(context)) {
                      ConsoleNotification.show(context);
                      return;
                  }

                  Calendar now = Calendar.getInstance();
                  if (AlarmScheduler.isAllowedByRunMode(context, now)) {
                      int expectedMinute = intent.getIntExtra(
                              AlarmScheduler.EXTRA_EXPECTED_MINUTE,
                              now.get(Calendar.MINUTE));
                      ChimePlayer.playForMinute(context, expectedMinute);
                  }
                  AlarmScheduler.scheduleNext(context);
              }
          }
          EOF_TEXT_7
          mkdir -p "$(dirname "app/src/main/java/com/iljagrim/bellapp/AlarmScheduler.java")"
          cat > "app/src/main/java/com/iljagrim/bellapp/AlarmScheduler.java" <<'EOF_TEXT_8'
          package com.iljagrim.bellapp;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;

          import java.util.Calendar;

          public final class AlarmScheduler {
              public static final String EXTRA_EXPECTED_MINUTE = "expected_minute";
              private static final int REQUEST_CODE = 1001;

              private AlarmScheduler() {}

              public static void scheduleNext(Context context) {
                  AlarmManager alarmManager = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                  if (alarmManager == null) return;

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S && !alarmManager.canScheduleExactAlarms()) {
                      ConsoleNotification.show(context);
                      return;
                  }

                  long triggerAtMillis = nextTriggerMillis(context);
                  Calendar trigger = Calendar.getInstance();
                  trigger.setTimeInMillis(triggerAtMillis);
                  PendingIntent pi = pendingIntent(context, trigger.get(Calendar.MINUTE));

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      alarmManager.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerAtMillis, pi);
                  } else {
                      alarmManager.setExact(AlarmManager.RTC_WAKEUP, triggerAtMillis, pi);
                  }
                  ConsoleNotification.show(context);
              }

              public static void cancel(Context context) {
                  AlarmManager alarmManager = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                  if (alarmManager != null) alarmManager.cancel(pendingIntent(context, 0));
                  ConsoleNotification.show(context);
              }

              public static long nextTriggerMillis(Context context) {
                  Calendar candidate = Calendar.getInstance();
                  candidate.set(Calendar.SECOND, 0);
                  candidate.set(Calendar.MILLISECOND, 0);

                  // Search up to 48 hours so night mode always finds the next daytime chime.
                  for (int i = 1; i <= 48 * 60; i++) {
                      candidate.add(Calendar.MINUTE, 1);
                      int minute = candidate.get(Calendar.MINUTE);
                      if (ChimePlayer.ringsForMinute(context, minute) > 0
                              && isAllowedByRunMode(context, candidate)) {
                          return candidate.getTimeInMillis();
                      }
                  }

                  throw new IllegalStateException("No valid BellApp trigger found");
              }

              public static boolean isAllowedByRunMode(Context context, Calendar time) {
                  if (AppPrefs.is24h(context)) return true;
                  int hour = time.get(Calendar.HOUR_OF_DAY);
                  int minute = time.get(Calendar.MINUTE);
                  return hour >= 6 && (hour < 22 || (hour == 22 && minute == 0));
              }

              private static PendingIntent pendingIntent(Context context, int expectedMinute) {
                  Intent intent = new Intent(context, AlarmReceiver.class);
                  intent.putExtra(EXTRA_EXPECTED_MINUTE, expectedMinute);
                  int flags = PendingIntent.FLAG_UPDATE_CURRENT;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) flags |= PendingIntent.FLAG_IMMUTABLE;
                  return PendingIntent.getBroadcast(context, REQUEST_CODE, intent, flags);
              }
          }
          EOF_TEXT_8
          mkdir -p "$(dirname "app/src/main/java/com/iljagrim/bellapp/AppPrefs.java")"
          cat > "app/src/main/java/com/iljagrim/bellapp/AppPrefs.java" <<'EOF_TEXT_9'
          package com.iljagrim.bellapp;

          import android.content.Context;
          import android.content.SharedPreferences;

          public final class AppPrefs {
              public static final String SOUND_BELL = "bell";
              public static final String SOUND_CUCKOO = "cuckoo";

              private static final String PREFS_NAME = "bellapp_prefs";
              private static final String KEY_ENABLED = "enabled";
              private static final String KEY_ADD_30 = "add_30";
              private static final String KEY_ADD_15 = "add_15";
              private static final String KEY_SOUND = "sound";
              private static final String KEY_MODE_24H = "mode_24h";

              private AppPrefs() {}

              private static SharedPreferences prefs(Context context) {
                  return context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
              }

              public static boolean isEnabled(Context context) {
                  return prefs(context).getBoolean(KEY_ENABLED, false);
              }

              public static void setEnabled(Context context, boolean enabled) {
                  prefs(context).edit().putBoolean(KEY_ENABLED, enabled).apply();
              }

              public static boolean add30(Context context) {
                  return prefs(context).getBoolean(KEY_ADD_30, false) || add15(context);
              }

              public static void setAdd30(Context context, boolean enabled) {
                  SharedPreferences.Editor e = prefs(context).edit();
                  e.putBoolean(KEY_ADD_30, enabled);
                  if (!enabled) e.putBoolean(KEY_ADD_15, false);
                  e.apply();
              }

              public static boolean add15(Context context) {
                  return prefs(context).getBoolean(KEY_ADD_15, false);
              }

              public static void setAdd15(Context context, boolean enabled) {
                  SharedPreferences.Editor e = prefs(context).edit();
                  e.putBoolean(KEY_ADD_15, enabled);
                  if (enabled) e.putBoolean(KEY_ADD_30, true);
                  e.apply();
              }

              public static String getSound(Context context) {
                  return prefs(context).getString(KEY_SOUND, SOUND_BELL);
              }

              public static void setSound(Context context, String sound) {
                  prefs(context).edit().putString(KEY_SOUND, sound).apply();
              }

              public static boolean is24h(Context context) {
                  return prefs(context).getBoolean(KEY_MODE_24H, false);
              }

              public static void set24h(Context context, boolean enabled) {
                  prefs(context).edit().putBoolean(KEY_MODE_24H, enabled).apply();
              }

              public static String chimeModeText(Context context) {
                  if (add15(context)) return "every 15 min";
                  if (add30(context)) return "every 30 min";
                  return "hourly";
              }

              public static String runModeText(Context context) {
                  return is24h(context) ? "24h" : "Night mode";
              }
          }
          EOF_TEXT_9
          mkdir -p "$(dirname "app/src/main/java/com/iljagrim/bellapp/BootReceiver.java")"
          cat > "app/src/main/java/com/iljagrim/bellapp/BootReceiver.java" <<'EOF_TEXT_10'
          package com.iljagrim.bellapp;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  String action = intent == null ? null : intent.getAction();
                  boolean relevant =
                          Intent.ACTION_BOOT_COMPLETED.equals(action)
                          || Intent.ACTION_TIME_CHANGED.equals(action)
                          || Intent.ACTION_TIMEZONE_CHANGED.equals(action)
                          || Intent.ACTION_MY_PACKAGE_REPLACED.equals(action);

                  if (!relevant) return;

                  if (AppPrefs.isEnabled(context)) {
                      AlarmScheduler.scheduleNext(context);
                  } else {
                      ConsoleNotification.show(context);
                  }
              }
          }
          EOF_TEXT_10
          mkdir -p "$(dirname "app/src/main/java/com/iljagrim/bellapp/ChimePlayer.java")"
          cat > "app/src/main/java/com/iljagrim/bellapp/ChimePlayer.java" <<'EOF_TEXT_11'
          package com.iljagrim.bellapp;

          import android.content.Context;
          import android.content.res.AssetFileDescriptor;
          import android.media.AudioAttributes;
          import android.media.MediaPlayer;
          import android.os.Handler;
          import android.os.Looper;

          public final class ChimePlayer {
              private static final Handler HANDLER = new Handler(Looper.getMainLooper());

              private ChimePlayer() {}

              public static int ringsForMinute(Context context, int minute) {
                  if (minute == 0) return 4;
                  if (minute == 30 && AppPrefs.add30(context)) return 2;
                  if (minute == 15 && AppPrefs.add15(context)) return 1;
                  if (minute == 45 && AppPrefs.add15(context)) return 3;
                  return 0;
              }

              public static void playForMinute(Context context, int minute) {
                  playCount(context, ringsForMinute(context, minute));
              }

              public static void playTest(Context context) {
                  playCount(context, 1);
              }

              public static void playCount(Context context, int count) {
                  if (count <= 0) return;
                  Context appContext = context.getApplicationContext();
                  for (int i = 0; i < count; i++) {
                      int delayMillis = i * 1100;
                      HANDLER.postDelayed(() -> playOne(appContext), delayMillis);
                  }
              }

              private static void playOne(Context context) {
                  int resourceId = AppPrefs.SOUND_CUCKOO.equals(AppPrefs.getSound(context))
                          ? R.raw.cuckoo
                          : R.raw.bell;

                  MediaPlayer player = new MediaPlayer();
                  try (AssetFileDescriptor afd = context.getResources().openRawResourceFd(resourceId)) {
                      if (afd == null) {
                          player.release();
                          return;
                      }
                      player.setAudioAttributes(new AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_ALARM)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                              .build());
                      player.setDataSource(afd.getFileDescriptor(), afd.getStartOffset(), afd.getLength());
                      player.setVolume(1.0f, 1.0f);
                      player.setOnCompletionListener(mp -> release(mp));
                      player.setOnErrorListener((mp, what, extra) -> {
                          release(mp);
                          return true;
                      });
                      player.prepare();
                      player.start();
                  } catch (Exception ignored) {
                      release(player);
                  }
              }

              private static void release(MediaPlayer player) {
                  try {
                      player.release();
                  } catch (Exception ignored) {
                  }
              }
          }
          EOF_TEXT_11
          mkdir -p "$(dirname "app/src/main/java/com/iljagrim/bellapp/ConsoleNotification.java")"
          cat > "app/src/main/java/com/iljagrim/bellapp/ConsoleNotification.java" <<'EOF_TEXT_12'
          package com.iljagrim.bellapp;

          import android.Manifest;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;

          public final class ConsoleNotification {
              private static final String CHANNEL_ID = "bellapp_console_v5";
              private static final int NOTIFICATION_ID = 501;

              private ConsoleNotification() {}

              public static void show(Context context) {
                  if (Build.VERSION.SDK_INT >= 33 && context.checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      return;
                  }
                  createChannel(context);
                  NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null) return;

                  boolean enabled = AppPrefs.isEnabled(context);
                  String title = enabled ? "BellApp · ON" : "BellApp · OFF";
                  String text = "Mode: " + AppPrefs.chimeModeText(context) + " · " + AppPrefs.runModeText(context);

                  Intent open = new Intent(context, MainActivity.class);
                  PendingIntent openPi = PendingIntent.getActivity(context, 10, open, flags());

                  Notification.Builder b = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                          ? new Notification.Builder(context, CHANNEL_ID)
                          : new Notification.Builder(context);

                  b.setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                          .setContentTitle(title)
                          .setContentText(text)
                          .setContentIntent(openPi)
                          .setOngoing(enabled)
                          .setAutoCancel(false)
                          .setShowWhen(false)
                          .addAction(android.R.drawable.ic_media_play, "Start", actionPi(context, ActionReceiver.ACTION_START, 11))
                          .addAction(android.R.drawable.ic_media_pause, "Stop", actionPi(context, ActionReceiver.ACTION_STOP, 12))
                          .addAction(android.R.drawable.ic_btn_speak_now, "Test", actionPi(context, ActionReceiver.ACTION_TEST, 13));

                  nm.notify(NOTIFICATION_ID, b.build());
              }

              private static void createChannel(Context context) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) return;
                  NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null) return;
                  NotificationChannel ch = new NotificationChannel(CHANNEL_ID, "BellApp console", NotificationManager.IMPORTANCE_LOW);
                  ch.setDescription("BellApp controls");
                  ch.setSound(null, null);
                  ch.enableVibration(false);
                  nm.createNotificationChannel(ch);
              }

              private static PendingIntent actionPi(Context context, String action, int request) {
                  Intent i = new Intent(context, ActionReceiver.class);
                  i.setAction(action);
                  return PendingIntent.getBroadcast(context, request, i, flags());
              }

              private static int flags() {
                  int f = PendingIntent.FLAG_UPDATE_CURRENT;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) f |= PendingIntent.FLAG_IMMUTABLE;
                  return f;
              }
          }
          EOF_TEXT_12
          mkdir -p "$(dirname "app/src/main/java/com/iljagrim/bellapp/MainActivity.java")"
          cat > "app/src/main/java/com/iljagrim/bellapp/MainActivity.java" <<'EOF_TEXT_13'
          package com.iljagrim.bellapp;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AlarmManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              private static final int BLUE = Color.rgb(103, 188, 224);
              private static final int YELLOW = Color.rgb(255, 215, 64);
              private static final int WHITE = Color.WHITE;

              private TextView stateValue, runValue, chimeValue, soundValue;
              private Button add30Button, add15Button, bellButton, cuckooButton, mode24Button, nightButton, startButton, stopButton;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestNotificationPermissionIfNeeded();
                  buildUi();
                  refresh();
                  ConsoleNotification.show(this);
              }


              @Override
              protected void onResume() {
                  super.onResume();
                  if (stateValue != null) refresh();
              }

              private void buildUi() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(22, 18, 22, 12);
                  root.setBackgroundColor(BLUE);

                  TextView title = tv("BellApp", 26, true); title.setGravity(Gravity.CENTER); root.addView(title, full(0,0,0,0));
                  TextView subtitle = tv("Time tracking", 15, true); subtitle.setGravity(Gravity.CENTER); root.addView(subtitle, full(0,0,0,0));
                  TextView line = tv("Rings every hour", 17, true); line.setGravity(Gravity.CENTER); root.addView(line, full(0,4,0,8));

                  TextView status = tv("Status", 18, true); root.addView(status, full());
                  stateValue = statusLine(root, "State");
                  runValue = statusLine(root, "Run mode");
                  chimeValue = statusLine(root, "Chime mode");
                  soundValue = statusLine(root, "Sound");

                  root.addView(tv("Rings 4 times at :00 min", 15, true), full(0,8,0,4));
                  add30Button = choice("○ Adds 2 rings at :30 min");
                  add30Button.setOnClickListener(v -> { AppPrefs.setAdd30(this, !AppPrefs.add30(this)); if (AppPrefs.isEnabled(this)) AlarmScheduler.scheduleNext(this); refresh(); });
                  root.addView(add30Button, full());

                  add15Button = choice("○ Adds 1 ring at :15 min\nAdds 3 rings at :45 min");
                  add15Button.setOnClickListener(v -> { AppPrefs.setAdd15(this, !AppPrefs.add15(this)); if (AppPrefs.isEnabled(this)) AlarmScheduler.scheduleNext(this); refresh(); });
                  root.addView(add15Button, full());

                  LinearLayout soundRow = row();
                  soundRow.addView(label("Sound"), weight(0.85f));
                  bellButton = choice("○ Bell"); cuckooButton = choice("○ Cuckoo");
                  bellButton.setOnClickListener(v -> { AppPrefs.setSound(this, AppPrefs.SOUND_BELL); refresh(); });
                  cuckooButton.setOnClickListener(v -> { AppPrefs.setSound(this, AppPrefs.SOUND_CUCKOO); refresh(); });
                  soundRow.addView(bellButton, weight(1)); soundRow.addView(cuckooButton, weight(1));
                  root.addView(soundRow, full());

                  LinearLayout modeRow = row();
                  modeRow.addView(label("Run mode"), weight(0.85f));
                  mode24Button = choice("○ 24h"); nightButton = choice("○ Night mode\n(rings at 06:00–22:00)");
                  mode24Button.setOnClickListener(v -> { AppPrefs.set24h(this, true); if (AppPrefs.isEnabled(this)) AlarmScheduler.scheduleNext(this); refresh(); });
                  nightButton.setOnClickListener(v -> { AppPrefs.set24h(this, false); if (AppPrefs.isEnabled(this)) AlarmScheduler.scheduleNext(this); refresh(); });
                  modeRow.addView(mode24Button, weight(1)); modeRow.addView(nightButton, weight(1));
                  root.addView(modeRow, full());
                  TextView nightInfo = tv("Night mode: first ring 06:00 · last ring 22:00", 12, false); nightInfo.setGravity(Gravity.CENTER); root.addView(nightInfo, full(0,0,0,4));

                  LinearLayout controlRow = row();
                  startButton = action("START"); stopButton = action("STOP"); Button testButton = action("TEST");
                  startButton.setOnClickListener(v -> { if (!canScheduleExactAlarms()) { openExactAlarmPermissionSettings(); return; } AppPrefs.setEnabled(this, true); AlarmScheduler.scheduleNext(this); refresh(); });
                  stopButton.setOnClickListener(v -> { AppPrefs.setEnabled(this, false); AlarmScheduler.cancel(this); refresh(); });
                  testButton.setOnClickListener(v -> ChimePlayer.playTest(this));
                  controlRow.addView(startButton, weight(1)); controlRow.addView(stopButton, weight(1)); controlRow.addView(testButton, weight(1));
                  root.addView(controlRow, full());

                  Button perm = action("Alarm permission · Open Android settings"); perm.setOnClickListener(v -> openExactAlarmPermissionSettings()); root.addView(perm, full());

                  LinearLayout footer = row();
                  Button privacy = small("Privacy"); privacy.setOnClickListener(v -> startActivity(new Intent(this, PrivacyActivity.class)));
                  Button github = small("GitHub"); github.setOnClickListener(v -> openUrl("__REPOSITORY_URL__"));
                  Button code = small("App code"); code.setOnClickListener(v -> openUrl("__REPOSITORY_URL__"));
                  footer.addView(privacy, weight(1)); footer.addView(github, weight(1)); footer.addView(code, weight(1));
                  root.addView(footer, full(0,4,0,0));
                  TextView version = tv("Version 6.2 evaluation", 11, false); version.setGravity(Gravity.CENTER); root.addView(version, full(0,0,0,0));

                  setContentView(root);
              }

              private TextView statusLine(LinearLayout root, String label) {
                  LinearLayout r = row();
                  TextView l = tv(label, 14, true);
                  TextView v = tv("", 14, false);
                  r.addView(l, weight(1)); r.addView(v, weight(1)); root.addView(r, full(0,0,0,0));
                  return v;
              }

              private void refresh() {
                  stateValue.setText(AppPrefs.isEnabled(this) ? "ON" : "OFF");
                  runValue.setText(AppPrefs.runModeText(this));
                  chimeValue.setText(AppPrefs.chimeModeText(this));
                  soundValue.setText(AppPrefs.SOUND_CUCKOO.equals(AppPrefs.getSound(this)) ? "Cuckoo" : "Bell");

                  setSelected(add30Button, AppPrefs.add30(this), "Adds 2 rings at :30 min");
                  setSelected(add15Button, AppPrefs.add15(this), "Adds 1 ring at :15 min\nAdds 3 rings at :45 min");
                  setSelected(bellButton, AppPrefs.SOUND_BELL.equals(AppPrefs.getSound(this)), "Bell");
                  setSelected(cuckooButton, AppPrefs.SOUND_CUCKOO.equals(AppPrefs.getSound(this)), "Cuckoo");
                  setSelected(mode24Button, AppPrefs.is24h(this), "24h");
                  setSelected(nightButton, !AppPrefs.is24h(this), "Night mode\n(rings at 06:00–22:00)");
                  setActionSelected(startButton, AppPrefs.isEnabled(this));
                  setActionSelected(stopButton, !AppPrefs.isEnabled(this));
                  ConsoleNotification.show(this);
              }

              private void setSelected(Button b, boolean selected, String text) {
                  b.setText((selected ? "● " : "○ ") + text);
                  b.setBackgroundColor(selected ? YELLOW : WHITE);
                  b.setTextColor(Color.BLACK);
              }

              private void setActionSelected(Button b, boolean selected) {
                  b.setBackgroundColor(selected ? YELLOW : WHITE);
                  b.setTextColor(Color.BLACK);
              }

              private void requestNotificationPermissionIfNeeded() {
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 3001);
                  }
              }

              private boolean canScheduleExactAlarms() {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.S) return true;
                  AlarmManager am = (AlarmManager) getSystemService(Context.ALARM_SERVICE);
                  return am != null && am.canScheduleExactAlarms();
              }

              private void openExactAlarmPermissionSettings() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      try { startActivity(new Intent(Settings.ACTION_REQUEST_SCHEDULE_EXACT_ALARM, Uri.parse("package:" + getPackageName()))); return; } catch (Exception ignored) {}
                  }
                  try { startActivity(new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + getPackageName()))); } catch (Exception ignored) {}
              }

              private void openUrl(String url) {
                  try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url))); } catch (Exception ignored) {}
              }

              private TextView tv(String s, int size, boolean bold) { TextView t = new TextView(this); t.setText(s); t.setTextSize(size); t.setTextColor(Color.BLACK); if (bold) t.setTypeface(Typeface.DEFAULT_BOLD); return t; }
              private TextView label(String s) { TextView t = tv(s, 14, true); t.setGravity(Gravity.CENTER_VERTICAL); return t; }
              private Button choice(String s) { Button b = new Button(this); b.setText(s); b.setTextSize(13); b.setAllCaps(false); b.setGravity(Gravity.CENTER); b.setPadding(4,0,4,0); b.setMinHeight(dp(38)); b.setBackgroundColor(WHITE); b.setTextColor(Color.BLACK); return b; }
              private Button action(String s) { Button b = choice(s); b.setTextSize(13); return b; }
              private Button small(String s) { Button b = choice(s); b.setTextSize(11); b.setMinHeight(dp(34)); return b; }
              private LinearLayout row() { LinearLayout l = new LinearLayout(this); l.setOrientation(LinearLayout.HORIZONTAL); return l; }
              private LinearLayout.LayoutParams weight(float w) { return new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, w); }
              private LinearLayout.LayoutParams full() { return full(0,2,0,2); }
              private LinearLayout.LayoutParams full(int l, int t, int r, int b) { LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT); p.setMargins(l,t,r,b); return p; }
              private int dp(int v) { return (int)(v * getResources().getDisplayMetrics().density + 0.5f); }
          }
