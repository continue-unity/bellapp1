# BELLAPP V6.9 CONTROL REDESIGN TEST — COPY THIS ENTIRE FILE
# GitHub filename: .github/workflows/build-bellapp.yml
#
# Based on V6.8 logo and V6.7/V6.8 audio fixes.
#
# New in V6.9:
# - Main UI redesigned around State / Period / Sound / Pattern.
# - 24h and Night mode removed.
# - Custom Ringing period with Start / Stop / Set and four wheels.
# - Default period 06:00–22:00.
# - First and last actual chimes inside the period are quieter.
# - Bell pattern modes: Single and Chapel.
# - 15 / 30 / 45 interval buttons are independent.
# - :00 remains the guaranteed hourly base chime.
# - STOP now stops active playback immediately.
# - Ringing notification is console-like with Silence and Stop.
# - Permanent notification shows BellApp ON/OFF and period only, with Test and Start/Stop.
# - Custom sound picker is enabled free for testing and monetisation-ready later.
# - Attempts pocket volume-button silence by watching volume changes only while actively ringing.
#
name: Build BellApp V6.9 control redesign test

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

