# BELLAPP V6.9.5 VIBRATION ALARM TEST — COPY THIS ENTIRE FILE
# GitHub filename: .github/workflows/build-bellapp.yml
#
# Based on V6.9.4 when available.
#
# New in V6.9.5:
# - Vibration now uses alarm vibration attributes instead of generic vibration.
# - API 33+: Vibrator.vibrate(effect, VibrationAttributes.USAGE_ALARM).
# - API 26-32: Vibrator.vibrate(effect, AudioAttributes.USAGE_ALARM).
# - Vibrate TEST is stronger: one 800 ms vibration.
# - Scheduled vibration pulses are stronger: 260 ms, boundary 160 ms.
# - Keeps SET button, bold Pattern label, visible dash, Silence-only ringing notification.
# - VIBRATE permission remains in manifest.
#
name: Build BellApp V6.9.5 vibration alarm test

